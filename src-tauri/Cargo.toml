[package]
name = "nearsend"
version = "0.1.0"
edition = "2021"
description = "Local-network file sharing with device approval"
license = "MIT"

[lib]
name = "nearsend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-plugin-dialog = "2"
